[project]
name = "aicybermagazinedemo"
version = "0.1.0"
description = "AICyberMagazineDemo using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.102.0,<1.0.0"
]

[project.scripts]
aicybermagazinedemo = "aicybermagazinedemo.main:run"
run_crew = "aicybermagazinedemo.main:run"
train = "aicybermagazinedemo.main:train"
replay = "aicybermagazinedemo.main:replay"
test = "aicybermagazinedemo.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
